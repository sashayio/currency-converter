<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>World Prices — Конвертер валют</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>">
</head>
<body>

  <!-- ===== SETUP SCREEN (first run) ===== -->
  <div id="setup-screen" class="screen">
    <div class="setup-container">
      <div class="setup-header">
        <div class="setup-logo">💱</div>
        <h1 class="setup-title">World Prices</h1>
        <p class="setup-subtitle">Конвертер валют и криптовалют</p>
      </div>

      <!-- Step 1: source currency -->
      <div id="setup-step-1" class="setup-step">
        <div class="setup-step-header">
          <h2 class="step-title">Из какой валюты конвертировать?</h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="setup-search-source" placeholder="Поиск валюты..." autocomplete="off">
          </div>
        </div>
        <div id="setup-source-list" class="currency-grid"></div>
        <div class="setup-step-footer">
          <button id="setup-next-btn" class="btn-primary" disabled>Далее →</button>
        </div>
      </div>

      <!-- Step 2: target currencies -->
      <div id="setup-step-2" class="setup-step hidden">
        <div class="setup-step-header">
          <h2 class="step-title">В какие валюты конвертировать?</h2>
          <p class="step-hint">Выберите одну или несколько</p>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="setup-search-target" placeholder="Поиск валюты..." autocomplete="off">
          </div>
        </div>
        <div id="setup-target-list" class="currency-grid"></div>
        <div class="setup-step-footer">
          <button id="setup-start-btn" class="btn-primary" disabled>Начать 🚀</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== MAIN SCREEN ===== -->
  <div id="main-screen" class="screen hidden">
    <header class="main-header">
      <div class="header-left">
        <span class="app-logo">💱</span>
        <span class="app-name">World Prices</span>
      </div>
      <div class="header-right">
        <button id="refresh-btn" class="icon-btn" title="Обновить курсы">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="theme-btn" class="icon-btn" title="Сменить тему">
          <svg id="theme-icon" viewBox="0 0 24 24" width="22" height="22"></svg>
        </button>
        <button id="export-btn" class="icon-btn" title="Экспорт в PNG">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Настройки">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.611 3.611 0 0112 15.6z"/></svg>
        </button>
      </div>
    </header>

    <!-- Amount Input -->
    <div class="amount-section">
      <div class="amount-input-wrapper">
        <button id="source-btn" class="source-currency-btn">
          <span id="source-flag" class="currency-flag"></span>
          <span id="source-code" class="currency-code">RUB</span>
          <svg class="chevron" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
        <input type="text" id="amount-input" inputmode="decimal" value="1 000" autocomplete="off">
      </div>
    </div>

    <!-- Reorder Edit Mode Toolbar -->
    <div id="reorder-toolbar" class="reorder-toolbar hidden">
      <div class="reorder-info">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        <span>Порядок валют (перетащите)</span>
      </div>
      <div class="reorder-actions">
        <button id="reorder-cancel-btn" class="reorder-btn btn-cancel">Отменить</button>
        <button id="reorder-save-btn" class="reorder-btn btn-save">Сохранить</button>
      </div>
    </div>

    <!-- Conversion Cards -->
    <div id="conversion-cards" class="conversion-cards"></div>

    <!-- Last updated -->
    <div class="footer-info">
      <span id="last-updated">Загрузка курсов...</span>
    </div>
  </div>

  <!-- ===== SETTINGS MODAL ===== -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button id="settings-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Source currency -->
        <div class="settings-section">
          <h3>Исходная валюта</h3>
          <div class="search-box compact">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="settings-search-source" placeholder="Поиск..." autocomplete="off">
          </div>
          <div id="settings-source-list" class="currency-list-compact"></div>
        </div>

        <!-- Target currencies -->
        <div class="settings-section">
          <h3>Целевые валюты</h3>
          <div class="search-box compact">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="settings-search-target" placeholder="Поиск..." autocomplete="off">
          </div>
          <div id="settings-target-list" class="currency-list-compact"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="settings-save" class="btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ===== EXPORT CONTAINER (off-screen, for PNG generation) ===== -->
  <div id="export-container" class="export-container"></div>

  <!-- ===== SOURCE CURRENCY PICKER MODAL ===== -->
  <div id="source-picker-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>Исходная валюта</h2>
        <button id="source-picker-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="search-box compact">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="source-picker-search" placeholder="Поиск..." autocomplete="off">
        </div>
        <div id="source-picker-list" class="currency-list-compact"></div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
